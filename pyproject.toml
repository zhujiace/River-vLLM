[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "river-vllm"
version = "0.1.0"
description = "River-LLM with vLLM V2 native conditional CUDA graphs"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["river_vllm"]
license-files = ["LICENSES/Apache-2.0.txt"]
